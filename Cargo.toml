[workspace]
resolver = "2"
members = [
    "crates/relay-core",
    "crates/relay-softcard",
    "crates/relay-pkcs11",
    "crates/relay-server",
    "crates/relay-test-approver",
    "crates/relayctl",
    "crates/relay-pcsc",
    "crates/relay-approver",
    "crates/relay-ffi",
]
# cargo-fuzz targets build with a nightly toolchain and their own lockfile.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
license = "Apache-2.0"
publish = false

# Every dependency version is pinned here; crates use `{ workspace = true }`.
# Only crates named in docs/spec.md or docs/milestones-1-4.md may be added
# without asking first.
[workspace.dependencies]
relay-core = { path = "crates/relay-core" }
relay-softcard = { path = "crates/relay-softcard" }
relay-server = { path = "crates/relay-server" }
relay-pcsc = { path = "crates/relay-pcsc" }
relay-approver = { path = "crates/relay-approver" }
relay-test-approver = { path = "crates/relay-test-approver" }

# Spec technology table. pgp 0.21 brings its own older RustCrypto generation
# (p256 0.13, rsa 0.9, ed25519-dalek 2) for OpenPGP only; no types cross over.
ciborium = "=0.2.2"
p256 = { version = "=0.14.0", features = ["ecdsa", "pkcs8", "ecdh"] }
ed25519-dalek = { version = "=3.0.0", features = ["pkcs8", "pem", "rand_core"] }
hpke = { version = "=0.15.1", default-features = false, features = ["alloc", "getrandom", "nistp", "aes"] }
sha2 = "=0.11.1"
pgp = "=0.21.1"

# Approved 2026-11-15 for milestone 1.
rsa = { version = "=0.10.0", features = ["hazmat", "pkcs1v15"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
zeroize = { version = "=1.9.1", features = ["derive"] }
rand_core = "=0.10.1"
getrandom = { version = "=0.4.3", features = ["sys_rng"] }
thiserror = "=2.0.21"
hex = "=0.4.3"
base64 = "=0.23.1"
data-encoding = "=2.11.1"
x509-cert = { version = "=0.3.0", features = ["builder"] }
# Approved 2026-11-17 (hardware attestation): X.509 path validation for YubiKey attestation
# chains. Already in the provider and iOS trees through rustls.
rustls-webpki = { version = "=0.103.17", default-features = false, features = ["std", "ring"] }
rustls-pki-types = { version = "=1.16.0", features = ["std"] }
# Approved 2026-11-17 (setup links): QR codes in relayctl only; no image dependency.
qrcode = { version = "=0.14.1", default-features = false, features = ["svg"] }
proptest = "=1.12.0"
# Approved 2026-11-15: constant-time primitives for the OAEP decoding vendored from rsa 0.10.
subtle = "=2.6.1"
# rand_core 0.6 as pgp 0.21 requires it (already in the tree through pgp): RNG for OpenPGP signing.
rand_core_06 = { package = "rand_core", version = "=0.6.4", features = ["getrandom"] }

# Approved 2026-11-15 for milestone 2 (axum, tokio, sqlx from the spec's technology table).
axum = { version = "=0.8.9", features = ["ws"] }
tokio = { version = "=1.54.1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
# 0.8: sqlx 0.9 needs rustc 1.94 and mise.toml pins 1.93.
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "sqlite"] }
clap = { version = "=4.6.7", features = ["derive", "env"] }
toml = "=1.2.1"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["json", "env-filter"] }
# ring rather than aws-lc-rs: no C toolchain beyond cc for static musl builds.
# http2: approved 2026-11-18 for APNs (h2 was already in the tree through hyper).
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-tungstenite = { version = "=0.30.0", features = ["rustls-tls-webpki-roots"] }
# Approved 2026-11-15 for ECC encryption and P-384 signing.
p384 = { version = "=0.14.0", features = ["ecdsa", "pkcs8", "ecdh"] }
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
ansi-x963-kdf = "=0.1.0"

# Approved 2026-11-15 for milestone 4. yubikey 0.8 (stable): RSA-2048 and P-256/P-384 key
# generation and 3DES management keys only; other keys are generated with ykman and imported.
# relayctl uses it for admin operations only; the renamed crates are its older-generation
# types (already in the tree), needed to call its certificate API.
yubikey = { version = "=0.8.0", features = ["untested"] }
p256-013 = { package = "p256", version = "=0.13.2" }
p384-013 = { package = "p384", version = "=0.13.1" }
x509-cert-02 = { package = "x509-cert", version = "=0.2.5" }
pcsc = "=2.9.0"
rpassword = "=7.5.5"

# Milestone 5 (spec technology table: the apps call the core through UniFFI).
uniffi = "=0.32.2"

# Approved 2026-11-15 for milestone 3.
axum-server = { version = "=0.9.2", features = ["tls-rustls-ring"] }
cryptoki-sys = "=0.5.0"
ureq = { version = "=3.5.2", default-features = false, features = ["rustls"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["sink", "std"] }

[profile.release]
panic = "unwind" # relay-pkcs11 relies on catch_unwind at the FFI boundary
