# Integration environment: relay (TLS), three test approvers, a test sshd and a client that
# runs the milestone 2 and 3 gates.
#   docker compose -f deploy/compose.test.yml up --build --exit-code-from client
# Approver A approves (and pairs the client), B denies after a delay, C has an expired
# attestation. Fixtures are generated fresh on every run.
name: pkcs11-relay-test

# One image for all test tooling, built once (by `fixtures`) and reused by the rest.
x-test-image: &test-image
  image: pkcs11-relay-test:dev
  pull_policy: never
  init: true # forward SIGTERM so `down` does not have to kill

services:
  # Stays up after generating: a one-shot container exiting makes `--exit-code-from` abort.
  fixtures:
    image: pkcs11-relay-test:dev
    init: true
    build:
      context: ..
      dockerfile: deploy/Dockerfile.test
    entrypoint: ["sh", "-c"]
    command:
      - relay-test-approver gen-fixtures --out /fixtures --root /fixtures --relay-url https://relay:8443
        && touch /fixtures/.ready && exec sleep infinity
    volumes: ["fixtures:/fixtures"]
    healthcheck:
      test: ["CMD", "test", "-f", "/fixtures/.ready"]
      interval: 1s
      retries: 60

  relay:
    image: pkcs11-relay:dev
    build:
      context: ..
      dockerfile: deploy/Dockerfile.relay
    command: ["--config", "/fixtures/relay.toml", "serve"]
    volumes: ["fixtures:/fixtures:ro", "relay-data:/data"]
    depends_on:
      fixtures: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "/relay-server", "healthcheck", "--url", "https://localhost:8443/healthz", "--ca", "/fixtures/relay-ca.pem"]
      interval: 2s
      timeout: 2s
      retries: 30

  approver-a:
    <<: *test-image
    command: ["run", "--config", "/fixtures/approver-a.toml", "--auto-approve"]
    volumes: ["fixtures:/fixtures"]
    depends_on:
      relay: { condition: service_healthy }

  approver-b:
    <<: *test-image
    command: ["run", "--config", "/fixtures/approver-b.toml", "--deny", "--delay", "3", "--long-poll"]
    volumes: ["fixtures:/fixtures"]
    depends_on:
      relay: { condition: service_healthy }

  approver-c:
    <<: *test-image
    command: ["run", "--config", "/fixtures/approver-c.toml", "--auto-approve", "--expired-attestation"]
    volumes: ["fixtures:/fixtures"]
    depends_on:
      relay: { condition: service_healthy }

  # A test sshd that trusts only the fixture auth-ec key (for `ssh -I`).
  sshd:
    <<: *test-image
    user: root
    entrypoint: ["sh", "-c"]
    command:
      - ssh-keygen -A && exec /usr/sbin/sshd -D -e -p 2222 -o StrictModes=no
        -o AuthorizedKeysFile=/fixtures/ssh_authorized_keys -o PasswordAuthentication=no
    volumes: ["fixtures:/fixtures:ro"]
    depends_on:
      fixtures: { condition: service_healthy }

  # Milestone 2 gate (relay protocol), then milestone 3 (pkcs11-tool, OpenSSL, OpenSSH).
  client:
    <<: *test-image
    entrypoint: ["sh", "-c"]
    command:
      - relay-test-approver gate --config /fixtures/gate.toml && /tests/m3-gate.sh
    volumes: ["fixtures:/fixtures"]
    depends_on:
      relay: { condition: service_healthy }
      sshd: { condition: service_started }
      approver-a: { condition: service_started }
      approver-b: { condition: service_started }
      approver-c: { condition: service_started }

volumes:
  fixtures:
  relay-data:
