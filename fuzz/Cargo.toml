[package]
name = "relay-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Outside the workspace (nightly + sanitizers); versions pinned to match the workspace.
[dependencies]
libfuzzer-sys = "=0.4.13"
relay-core = { path = "../crates/relay-core", features = ["test-util"] }

[[bin]]
name = "cbor_messages"
path = "fuzz_targets/cbor_messages.rs"
test = false
doc = false
bench = false

[[bin]]
name = "manifest_json"
path = "fuzz_targets/manifest_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "openpgp_signature"
path = "fuzz_targets/openpgp_signature.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apdu_responses"
path = "fuzz_targets/apdu_responses.rs"
test = false
doc = false
bench = false
