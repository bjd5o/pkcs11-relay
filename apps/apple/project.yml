# XcodeGen spec: `xcodegen` here writes RelayApprover.xcodeproj (not committed).
# Build the Rust side first: apps/apple/build-xcframework.sh (RelayApprover) and
# apps/apple/build-provider-xcframework.sh (SampleSigner).
name: RelayApprover
options:
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  RelayApprover:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - RelayApprover
      - path: Generated/bindings/relay_ffi.swift
        group: Generated
        # So xcodegen also runs when only RelayPKCS11 is built (tests/sim-provider.sh).
        optional: true
    dependencies:
      - framework: Generated/RelayFFI.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).relay-approver
        INFOPLIST_FILE: RelayApprover/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": RelayApprover/iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": RelayApprover/iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": RelayApprover/macOS.entitlements
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # RelayFFI.xcframework is arm64 only (Apple silicon Macs and simulators).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
        ENABLE_PREVIEWS: YES
  RelayApproverTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [RelayApproverTests]
    dependencies:
      - target: RelayApprover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
        "EXCLUDED_ARCHS[sdk=macosx*]": x86_64
        BUNDLE_LOADER: $(TEST_HOST)
  RelayApproverUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources: [RelayApproverUITests]
    dependencies:
      - target: RelayApprover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        TEST_TARGET_NAME: RelayApprover
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
  # The iPad sample app for the PKCS#11 provider (milestone 7). It links RelayPKCS11 only,
  # never RelayFFI: two Rust static libraries in one binary give duplicate std symbols.
  SampleSigner:
    type: application
    supportedDestinations: [iOS]
    sources: [SampleSigner]
    dependencies:
      - framework: Generated/RelayPKCS11.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).sample-signer
        INFOPLIST_FILE: SampleSigner/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "2"
        # RelayPKCS11.xcframework is arm64 only (devices and Apple silicon simulators).
        "EXCLUDED_ARCHS[sdk=iphonesimulator*]": x86_64
schemes:
  RelayApprover:
    build:
      targets:
        RelayApprover: all
        RelayApproverTests: [test]
        RelayApproverUITests: [test]
    test:
      targets: [RelayApproverTests, RelayApproverUITests]
  SampleSigner:
    build:
      targets:
        SampleSigner: all
