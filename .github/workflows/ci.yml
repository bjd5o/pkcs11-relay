name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --manifest-path fuzz/Cargo.toml
  integration:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.test.yml up --build --exit-code-from client
      - if: always()
        run: docker compose -f deploy/compose.test.yml logs --no-color relay approver-a approver-b approver-c
      - if: always()
        run: docker compose -f deploy/compose.test.yml down -v
  provider:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, libc: gnu, runner: ubuntu-24.04, image: "rust:1.93-bookworm", setup: "true" }
          - { arch: aarch64, libc: gnu, runner: ubuntu-24.04-arm, image: "rust:1.93-bookworm", setup: "true" }
          # musl targets link statically by default, which rules out a cdylib.
          - { arch: x86_64, libc: musl, runner: ubuntu-24.04, image: "rust:1.93-alpine", setup: "apk add --no-cache musl-dev", rustflags: "-C target-feature=-crt-static" }
          - { arch: aarch64, libc: musl, runner: ubuntu-24.04-arm, image: "rust:1.93-alpine", setup: "apk add --no-cache musl-dev", rustflags: "-C target-feature=-crt-static" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # JavaScript actions cannot run inside Alpine containers on arm64 runners, so checkout
      # and upload run on the host and only the build runs in the image.
      - name: build in ${{ matrix.image }}
        env:
          IMAGE: ${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          BUILD_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e RUSTFLAGS="$BUILD_RUSTFLAGS" "$IMAGE" \
            sh -c "$SETUP && cargo build --release --locked -p relay-pkcs11"
      - run: cp target/release/librelay_pkcs11.so librelay_pkcs11-${{ matrix.arch }}-${{ matrix.libc }}.so
      - uses: actions/upload-artifact@v4
        with:
          name: librelay_pkcs11-${{ matrix.arch }}-${{ matrix.libc }}
          path: librelay_pkcs11-*.so
