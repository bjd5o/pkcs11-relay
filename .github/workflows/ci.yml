name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcsclite-dev
      # The Rust version comes from mise.toml, which follows the flake's nixpkgs (sync-rust).
      - run: echo "RUST=$(sed -n 's/^rust = { version = \"\([^\"]*\)\".*/\1/p' mise.toml)" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$RUST" --profile minimal -c rustfmt,clippy && rustup default "$RUST"
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo check --manifest-path fuzz/Cargo.toml
  integration:
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f deploy/compose.test.yml up --build --exit-code-from client
      - if: always()
        run: docker compose -f deploy/compose.test.yml logs --no-color relay approver-a approver-b approver-c
      - if: always()
        run: docker compose -f deploy/compose.test.yml down -v
  provider:
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, libc: gnu, runner: ubuntu-24.04, image: bookworm, setup: "true" }
          - { arch: aarch64, libc: gnu, runner: ubuntu-24.04-arm, image: bookworm, setup: "true" }
          # musl targets link statically by default, which rules out a cdylib.
          - { arch: x86_64, libc: musl, runner: ubuntu-24.04, image: alpine, setup: "apk add --no-cache musl-dev", rustflags: "-C target-feature=-crt-static" }
          - { arch: aarch64, libc: musl, runner: ubuntu-24.04-arm, image: alpine, setup: "apk add --no-cache musl-dev", rustflags: "-C target-feature=-crt-static" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # The Rust version comes from mise.toml, which follows the flake's nixpkgs (sync-rust).
      - run: echo "RUST=$(sed -n 's/^rust = { version = \"\([^\"]*\)\".*/\1/p' mise.toml)" >> "$GITHUB_ENV"
      # JavaScript actions cannot run inside Alpine containers on arm64 runners, so checkout
      # and upload run on the host and only the build runs in the image.
      - name: build in rust:${{ env.RUST }}-${{ matrix.image }}
        env:
          IMAGE: rust:${{ env.RUST }}-${{ matrix.image }}
          SETUP: ${{ matrix.setup }}
          BUILD_RUSTFLAGS: ${{ matrix.rustflags }}
        run: |
          docker run --rm -v "$PWD:/src" -w /src -e RUSTFLAGS="$BUILD_RUSTFLAGS" "$IMAGE" \
            sh -c "$SETUP && cargo build --release --locked -p relay-pkcs11"
      - run: cp target/release/librelay_pkcs11.so librelay_pkcs11-${{ matrix.arch }}-${{ matrix.libc }}.so
      - uses: actions/upload-artifact@v4
        with:
          name: librelay_pkcs11-${{ matrix.arch }}-${{ matrix.libc }}
          path: librelay_pkcs11-*.so
  apple:
    # Milestone 5: the approver app in the iOS simulator against a real relay, with relay-ffi's
    # software test card (tests/sim-e2e.sh). No YubiKey, no signing.
    needs: rust
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The Rust version comes from mise.toml, which follows the flake's nixpkgs (sync-rust).
      - run: echo "RUST=$(sed -n 's/^rust = { version = \"\([^\"]*\)\".*/\1/p' mise.toml)" >> "$GITHUB_ENV"
      - run: |
          rustup toolchain install "$RUST" --profile minimal --target aarch64-apple-ios,aarch64-apple-ios-sim
          rustup default "$RUST"
      - run: brew install xcodegen
      - run: tests/sim-e2e.sh
  provider-macos:
    # Milestone 7, part A: the universal dylib, the milestone 3 checks natively on a Mac
    # (tests/macos-gate.sh) against the arm64 slice, and the Nix flake. Unsigned: signing and
    # notarization stay with Brian (deploy/macos/notarize.sh).
    needs: rust
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The Rust version comes from mise.toml, which follows the flake's nixpkgs (sync-rust).
      - run: echo "RUST=$(sed -n 's/^rust = { version = \"\([^\"]*\)\".*/\1/p' mise.toml)" >> "$GITHUB_ENV"
      - run: |
          rustup toolchain install "$RUST" --profile minimal --target x86_64-apple-darwin
          rustup default "$RUST"
      # Flox for the gate's callers (.flox/env); its installer also brings Nix for the flake.
      - uses: flox/install-flox-action@v2
      - run: deploy/macos/build-provider.sh
      - name: both slices present
        run: |
          archs=$(lipo -archs dist/librelay_pkcs11-macos-universal.dylib)
          echo "$archs"
          for a in arm64 x86_64; do echo "$archs" | grep -qw "$a"; done
      - run: MOD=dist/librelay_pkcs11-aarch64-apple-darwin.dylib flox activate -- tests/macos-gate.sh
      - run: nix flake check
      - uses: actions/upload-artifact@v4
        with:
          name: librelay_pkcs11-macos
          path: dist/librelay_pkcs11-*.dylib
  flake-linux:
    # The flake's Linux package and the Rust version check (mise.toml = nixpkgs' rustc).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flox/install-flox-action@v2
      - run: nix flake check
